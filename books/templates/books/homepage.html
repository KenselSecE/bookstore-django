{% extends 'books/layout.html' %}

{% block content %}
    <h1>Bookstore</h1>

    {% for book in books %}
        <div>
            <h2><a href="{% url 'book_detail' book.id %}">{{ book.title }}</a></h2>
            <p>by {{ book.author }} ({{ book.year }})</p>
        </div>
    {% endfor %}
{% endblock %}
